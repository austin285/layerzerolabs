<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-labelledby="title desc">
  <title id="title">Layer Zero Labs</title>
  <desc id="desc">Compact metallic Layer Zero Labs wordmark with an electric blue slashed zero</desc>
  <defs>
    <filter id="blue-glow" x="-50%" y="-60%" width="200%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chrome-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#D9E2EB"/>
      <stop offset="100%" stop-color="#8EA0B2"/>
    </linearGradient>
    <linearGradient id="electric-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00C8FF" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#00E7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g fill="url(#chrome)" filter="url(#chrome-glow)"
     font-family="Orbitron, sans-serif" font-weight="900" font-size="30" letter-spacing="1">
    <text x="4" y="48">LAYER</text>
    <text x="130" y="48">ZER</text>
    <text x="246" y="48">LABS</text>
  </g>

  <g filter="url(#blue-glow)" aria-hidden="true">
    <circle cx="225" cy="37" r="14" fill="none" stroke="#00D9FF" stroke-width="2"/>
    <path d="M238 16 L226 32 L233 31 L212 58 L220 41 L214 42 Z" fill="#00E7FF"/>
  </g>

  <rect x="2" y="59" width="354" height="1.5" fill="url(#electric-line)"/>
  <text x="4" y="73" font-family="'Share Tech Mono', monospace" font-size="8"
        letter-spacing="2.5" fill="#57809E">// PRECISION FDM · GEORGIA</text>
</svg>
