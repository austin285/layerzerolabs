<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 80" role="img" aria-labelledby="title desc">
  <title id="title">Layer Zero Labs</title>
  <desc id="desc">Metallic Layer Zero Labs wordmark with an electric blue zero</desc>
  <defs>
    <filter id="blue-glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="chrome-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#D9E2EB"/>
      <stop offset="100%" stop-color="#8EA0B2"/>
    </linearGradient>
    <linearGradient id="electric-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#00C8FF" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#00E7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <text x="16" y="49" font-family="Orbitron, sans-serif" font-weight="900" font-size="35" letter-spacing="2.5" fill="url(#chrome)" filter="url(#chrome-glow)">LAYER</text>
  <text x="185" y="50" font-family="Orbitron, sans-serif" font-weight="900" font-size="39" fill="none" stroke="#00C8FF" stroke-width="1.7" filter="url(#blue-glow)">Ø</text>
  <text x="224" y="49" font-family="Orbitron, sans-serif" font-weight="900" font-size="35" letter-spacing="2.5" fill="url(#chrome)" filter="url(#chrome-glow)">LABS</text>
  <rect x="12" y="59" width="366" height="1.5" fill="url(#electric-line)"/>
  <text x="16" y="73" font-family="'Share Tech Mono', monospace" font-size="8.5" letter-spacing="3.2" fill="#57809E">// PRECISION FDM · GEORGIA</text>
</svg>
