<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Layer Zero Labs electric zero</title>
  <desc id="desc">Electric blue slashed zero on a dark navy field</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#102D4D"/>
      <stop offset="100%" stop-color="#030812"/>
    </radialGradient>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DF5FF"/>
      <stop offset="45%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#168BFF"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)" stroke="#1B3C5E" stroke-width="4"/>
  <g transform="translate(64 64)" filter="url(#glow)">
    <circle r="31" fill="#030812" stroke="url(#electric)" stroke-width="8"/>
    <path d="M21-42 10-20 23-23-18 44-8 20-22 24Z" fill="url(#electric)"/>
  </g>
</svg>
